<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a56db" />
  <link rel="manifest" href="/qr-credential-verifier/manifest.webmanifest" />
  <title>デジタル資格者証 QR検証</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6;
      color: #111;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a56db;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 1rem; font-weight: 600; }

    nav {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }
    nav button {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      font-size: 0.85rem;
      cursor: pointer;
      color: #6b7280;
      border-bottom: 2px solid transparent;
    }
    nav button.active { color: #1a56db; border-bottom-color: #1a56db; font-weight: 600; }

    main { flex: 1; overflow-y: auto; }

    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    /* Scanner */
    #scanner-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 1;
    }
    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #canvas { display: none; }

    .scan-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .scan-frame {
      width: 60%;
      aspect-ratio: 1;
      border: 3px solid #fff;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }
    .btn-primary { background: #1a56db; color: #fff; }
    .btn-secondary { background: #fff; color: #1a56db; border: 1px solid #1a56db; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #scan-status {
      text-align: center;
      margin-top: 10px;
      font-size: 0.85rem;
      color: #6b7280;
      min-height: 20px;
    }

    /* Result card */
    #result-card {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      border: 1px solid #e5e7eb;
    }
    #result-card.show { display: block; }
    #result-card h3 { font-size: 0.85rem; color: #6b7280; margin-bottom: 6px; }
    #result-url {
      word-break: break-all;
      font-size: 0.85rem;
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-verified { background: #d1fae5; color: #059669; }
    .badge-warning { background: #fef3c7; color: #d97706; }

    #error-msg {
      display: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-top: 12px;
    }
    #error-msg.show { display: block; }

    /* History */
    #history-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      border: 1px solid #e5e7eb;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .history-date { font-size: 0.75rem; color: #9ca3af; }
    .history-url {
      font-size: 0.8rem;
      color: #374151;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .history-actions { display: flex; gap: 8px; }
    .history-actions button {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      font-size: 0.78rem;
      cursor: pointer;
      background: #f9fafb;
    }
    .history-actions .btn-del { color: #dc2626; border-color: #fca5a5; background: #fff; }
    #history-empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 0.9rem; }
    #clear-all-btn { margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3m0 4h4v-4m-4 0h-3v4"/></svg>
    <h1>デジタル資格者証 QR検証</h1>
  </header>

  <nav>
    <button class="active" data-page="scan">📷 スキャン</button>
    <button data-page="history">📋 履歴</button>
  </nav>

  <main>
    <!-- スキャンページ -->
    <div id="page-scan" class="page active">
      <div id="scanner-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="scan-overlay"><div class="scan-frame"></div></div>
      </div>
      <p id="scan-status">「スキャン開始」をタップしてカメラを起動してください</p>
      <div id="error-msg"></div>
      <button id="start-btn" class="btn btn-primary">📷 スキャン開始</button>
      <button id="stop-btn" class="btn btn-secondary" style="display:none">⏹ 停止</button>

      <div id="result-card">
        <h3>スキャン結果</h3>
        <div id="result-url"></div>
        <div id="result-badge" style="margin-top:8px"></div>
        <button id="verify-btn" class="btn btn-primary" style="margin-top:12px">🔍 検証サイトで確認</button>
        <button id="verified-btn" class="btn btn-secondary" style="display:none">✓ 検証しました</button>
        <button id="rescan-btn" class="btn btn-secondary" style="margin-top:8px">🔄 再スキャン</button>
      </div>
    </div>

    <!-- 履歴ページ -->
    <div id="page-history" class="page">
      <ul id="history-list"></ul>
      <p id="history-empty" style="display:none">スキャン履歴がありません</p>
      <button id="clear-all-btn" class="btn btn-danger" style="display:none">🗑 全件削除</button>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
